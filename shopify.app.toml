# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3516d452a0d884164a3f4126e9d2b98d"
name = "Age Guard - Age Verification"
application_url = "https://age-guard.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_themes"

[auth]
redirect_urls = [ "https://age-guard.vercel.app/auth/callback", "https://age-guard.vercel.app/api/auth" ]

[app_proxy]
url = "https://age-guard.vercel.app/age-guard"
subpath = "age-guard"
prefix = "apps"
